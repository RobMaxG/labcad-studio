<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabCAD Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M3 8 12 3l9 5-9 5z%27 fill=%27%239fc0e8%27/%3E%3Cpath d=%27M3 8v8l9 5V13z%27 fill=%27%236f8db0%27/%3E%3Cpath d=%27M21 8v8l-9 5V13z%27 fill=%27%23ff9f43%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Saira+Semi+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bed:#1d2025; --bed-2:#171a1e; --panel:#22262c; --line:#30353d; --line-2:#3c424b;
    --ink:#e8e3da; --ink-2:#a9aeb6; --ink-3:#6f757f;
    --marker:#ff9f43; --marker-ink:#2a1a06; --pla:#9fc0e8; --ok:#8fd19e; --bad:#f07a7a;
    --rail:52px; --side:360px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bed);color:var(--ink);font:14px/1.45 "Instrument Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--marker);outline-offset:2px}
  #app{display:grid;grid-template-columns:var(--rail) 1fr var(--side);height:100%}
  /* tool rail */
  #rail{background:var(--bed-2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px}
  #rail button{width:36px;height:36px;border-radius:8px;color:var(--ink-2);display:grid;place-items:center;position:relative}
  #rail button:hover{background:var(--panel);color:var(--ink)}
  #rail button[aria-pressed=true]{background:var(--marker);color:var(--marker-ink)}
  #rail button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  #rail .sep{height:1px;width:24px;background:var(--line-2);margin:6px 0}
  #rail button[title]:hover::after{content:attr(title);position:absolute;left:44px;top:50%;transform:translateY(-50%);background:var(--panel);border:1px solid var(--line-2);padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:12px;color:var(--ink);pointer-events:none;z-index:5}
  /* viewport */
  #stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#262a31 0%,var(--bed) 60%,#15181c 100%)}
  #stage canvas{display:block}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .pin-label{background:var(--marker);color:var(--marker-ink);font-weight:700;font-size:12px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;transform:translate(10px,-10px);box-shadow:0 1px 4px rgba(0,0,0,.5)}
  .dim-label{background:var(--panel);border:1px solid var(--marker);color:var(--ink);font-size:12px;padding:1px 6px;border-radius:4px;white-space:nowrap}
  #partbar{position:absolute;top:14px;left:16px;display:flex;align-items:center;gap:10px}
  #partbar select{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-weight:600}
  #hint{position:absolute;top:104px;left:50%;transform:translateX(-50%);color:var(--ink-2);font-size:13px;background:rgba(23,26,30,.8);padding:4px 12px;border-radius:999px;border:1px solid var(--line);opacity:0;transition:opacity .15s}
  #hint.on{opacity:1}
  #section{position:absolute;left:16px;bottom:16px;display:none;align-items:center;gap:10px;background:rgba(23,26,30,.85);border:1px solid var(--line);padding:8px 12px;border-radius:10px}
  #section.on{display:flex}
  #section select{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:2px 6px}
  #section input[type=range]{width:180px;accent-color:var(--marker)}
  #section #sec-flip{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--ink-2);min-width:88px}
  #section #sec-flip:hover{color:var(--ink)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .chk input{accent-color:var(--marker)}
  #blueprint{position:absolute;inset:0;background:var(--bed);z-index:4;display:flex;flex-direction:column}
  #blueprint[hidden]{display:none}
  #blueprint .bar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);font-weight:600}
  #blueprint .bar .grow{flex:1}
  #bp-sheet{flex:1;overflow:auto;display:grid;place-items:center;padding:18px}
  #bp-sheet svg{width:min(100%,1500px);height:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:2px}
  #bp-wait{color:var(--ink-3)}
  /* title block — an engineering drawing's, bottom right of the sheet */
  #title{position:absolute;right:16px;bottom:16px;border:1px solid var(--ink-3);background:rgba(23,26,30,.85);backdrop-filter:blur(6px);display:grid;grid-template-columns:auto auto;min-width:300px;font-size:12.5px}
  #title div{padding:5px 10px;border-top:1px solid var(--line-2)}
  #title div:nth-child(-n+2){border-top:0}
  #title div:nth-child(odd){color:var(--ink-3);border-right:1px solid var(--line-2)}
  #title .big{font-size:16px;font-weight:600;color:var(--ink)}
  /* side panel */
  #side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #tabs{display:flex;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:12px 0 10px;color:var(--ink-3);border-bottom:2px solid transparent;font-weight:600}
  #tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--marker)}
  .pane{display:none;flex:1;min-height:0;flex-direction:column}
  .pane.on{display:flex}
  .scroll{flex:1;overflow:auto;padding:14px 16px}
  /* talk */
  .msg{margin:0 0 14px;max-width:100%}
  .msg .who{font-size:12px;color:var(--ink-3);margin-bottom:2px}
  .msg .who b{color:var(--ink-2);font-weight:600}
  .msg.user .body{background:var(--bed-2);border:1px solid var(--line);border-radius:10px 10px 10px 2px;padding:8px 11px}
  .msg.assistant .body{padding:0 0 0 11px;border-left:2px solid var(--marker)}
  .msg.build .body{color:var(--ink-2);font-size:13px}
  .msg .v{color:var(--marker);cursor:pointer;font-weight:600}
  .msg .pins{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--ink-2)}
  .msg .pins li::before{content:attr(data-n);display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--marker);color:var(--marker-ink);font-size:10px;font-weight:700;margin-right:6px}
  #live{color:var(--ink-2);font-size:13px;min-height:1.4em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #live.busy::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--marker);margin-right:8px;animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){#live.busy::before{animation:none}}
  #compose{border-top:1px solid var(--line);padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px}
  #draftpins{display:flex;flex-direction:column;gap:6px}
  .dp{display:flex;align-items:center;gap:8px;font-size:13px}
  .dp .n{width:20px;height:20px;border-radius:50%;background:var(--marker);color:var(--marker-ink);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
  .dp input{flex:1;background:var(--bed-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  .dp .xyz{color:var(--ink-3);font-size:11.5px;flex:none}
  .dp button{color:var(--ink-3);padding:2px 6px}
  .dp button:hover{color:var(--bad)}
  #attach{display:flex;gap:6px;flex-wrap:wrap}
  #attach .a{position:relative;width:64px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line-2)}
  #attach .a img{width:100%;height:100%;object-fit:cover}
  #attach .a button{position:absolute;top:0;right:0;background:rgba(0,0,0,.6);color:#fff;width:18px;height:18px;font-size:12px;line-height:1;border-radius:0 0 0 6px}
  #compose.drop{outline:2px dashed var(--marker);outline-offset:-6px}
  .msg .shots{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .msg .shots img{height:64px;border-radius:6px;border:1px solid var(--line-2);cursor:zoom-in}
  #text{width:100%;min-height:74px;resize:vertical;background:var(--bed-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  #send{align-self:flex-end;background:var(--marker);color:var(--marker-ink);font-weight:700;padding:9px 16px;border-radius:8px}
  #send:disabled{opacity:.45;cursor:default}
  /* knobs */
  .knob{display:grid;grid-template-columns:1fr 64px;gap:4px 10px;align-items:center;margin-bottom:12px}
  .knob label{grid-column:1/3;display:flex;justify-content:space-between;font-size:13px}
  .knob label span{color:var(--ink-3)}
  .knob.changed label{color:var(--marker)}
  .knob input[type=range]{width:100%;accent-color:var(--marker)}
  .knob input[type=number]{background:var(--bed-2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;width:64px;text-align:right}
  #knobfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center}
  #knobfoot .grow{flex:1;color:var(--ink-3);font-size:13px}
  .btn{background:var(--bed-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 14px;font-weight:600;color:inherit;text-decoration:none;display:inline-block}
  .btn.primary{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
  .btn:disabled{opacity:.45;cursor:default}
  /* versions */
  .ver{display:grid;grid-template-columns:52px 1fr auto;gap:2px 10px;padding:10px 8px;border-radius:8px;cursor:pointer;align-items:baseline}
  .ver:hover{background:var(--bed-2)}
  .ver.on{background:var(--bed-2);box-shadow:inset 2px 0 0 var(--marker)}
  .ver .tag{font-weight:700}
  .ver .msg2{color:var(--ink);grid-column:2/4}
  .ver .meta{color:var(--ink-3);font-size:12px;grid-column:2/4}
  .ver .dl{grid-column:2/4;font-size:12px}
  .ver .dl a{color:var(--ink-2);margin-right:12px}
  #empty{color:var(--ink-3);padding:40px 20px;text-align:center}
  .ver .act{grid-column:2/4;font-size:12px;display:flex;gap:12px}
  .ver .act button{color:var(--ink-2);padding:0}
  .ver .act button:hover{color:var(--marker)}
  #lineage{color:var(--ink-3);font-size:12.5px}
  #lineage b{color:var(--ink-2);font-weight:600;cursor:pointer}
  #renbtn{color:var(--ink-2);font-weight:600;padding:6px 10px;border:1px solid transparent;border-radius:8px}
  #renbtn:hover{color:var(--ink);border-color:var(--line-2)}
  #askdlg{position:absolute;top:56px;left:16px;width:360px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:7}
  #askdlg.on{display:flex}
  #askdlg h3{margin:0;font-size:14px;font-weight:600}
  #askdlg input{background:var(--bed-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
  #askdlg .row{display:flex;gap:8px;justify-content:flex-end}
  .ver .act button.ren{margin-left:auto}
  #libbtn,#refbtn,#prbtn{color:var(--ink-2);text-decoration:none;font-weight:600;padding:6px 10px;border:1px solid transparent;border-radius:8px}
  #libbtn:hover,#refbtn:hover,#prbtn:hover{color:var(--ink);border-color:var(--line-2)}
  #prchip{position:absolute;top:56px;left:16px;display:flex;align-items:center;gap:8px;background:rgba(23,26,30,.82);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:12.5px;color:var(--ink-2)}
  #prchip select{background:transparent;border:0;color:var(--ink);font-weight:600;padding:2px 4px}
  #prchip select option{background:var(--panel)}
  #prfit{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);white-space:nowrap}
  #prfit.fits{color:var(--ok);border-color:rgba(143,209,158,.5)}
  #prfit.rotate,#prfit.diagonal{color:#e8c37a;border-color:rgba(232,195,122,.5)}
  #prfit.too_big{color:var(--bad);border-color:rgba(240,122,122,.5)}
  #newbtn{background:var(--marker);border:1px solid var(--marker);border-radius:8px;padding:6px 12px;font-weight:700;color:var(--marker-ink)}
  #newdlg{position:absolute;top:56px;left:16px;width:420px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:6}
  #newdlg.on{display:flex}
  #newdlg h3{margin:0;font-size:14px;font-weight:600}
  #newdlg input[type=text],#newdlg textarea{background:var(--bed-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
  #newdlg textarea{min-height:96px;resize:vertical}
  #newdlg .row{display:flex;gap:8px;justify-content:flex-end}
  #new-attach{display:flex;gap:6px;flex-wrap:wrap}
  #new-attach .a{position:relative;width:64px;height:48px;border-radius:6px;overflow:hidden;border:1px solid var(--line-2)}
  #new-attach .a img{width:100%;height:100%;object-fit:cover}
  #forkbtn{background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-weight:600;color:var(--ink-2)}
  #forkbtn:hover{color:var(--ink);border-color:var(--ink-3)}
  #forkdlg{position:absolute;top:56px;left:16px;width:340px;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:6}
  #forkdlg.on{display:flex}
  #forkdlg h3{margin:0;font-size:14px;font-weight:600}
  #forkdlg input[type=text]{background:var(--bed-2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
  #forkdlg .mode{display:flex;flex-direction:column;gap:6px;font-size:13px}
  #forkdlg .mode label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
  #forkdlg .mode input{accent-color:var(--marker);margin-top:3px}
  #forkdlg .mode span span{display:block;color:var(--ink-3);font-size:12px}
  #forkdlg .row{display:flex;gap:8px;justify-content:flex-end}
  #ghostsrc{position:absolute;left:16px;bottom:16px;display:none;align-items:center;gap:8px;background:rgba(23,26,30,.85);border:1px solid var(--line);padding:8px 12px;border-radius:10px;font-size:13px;color:var(--ink-2)}
  #ghostsrc.on{display:flex}
  #ghostsrc select{background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;color:var(--ink)}
  #section.on ~ #ghostsrc.on{bottom:64px}
  .tlwrap{background:var(--bed-2);border:1px solid var(--line);border-radius:10px;padding:6px 4px}
  .fam{list-style:none;margin:0;padding:0}
  .fam ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px solid var(--line-2);margin-left:9px}
  .fam li{padding:2px 0}
  .fam .node{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:8px;cursor:pointer;align-items:baseline}
  .fam .node:hover{background:var(--bed-2)}
  .fam .node.on{background:var(--bed-2);box-shadow:inset 2px 0 0 var(--marker)}
  .fam .node .nm{font-weight:600}
  .fam .node .ct{color:var(--ink-3);font-size:12px}
  .fam .node .why{grid-column:1/3;color:var(--ink-3);font-size:12px}
  .err{color:var(--bad)}
  @media (max-width:900px){#app{grid-template-columns:var(--rail) 1fr;grid-template-rows:55vh 45vh}#side{grid-column:1/3;border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Tools">
    <button id="t-home" title="Fit view (H)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="9" y="9" width="6" height="6"/></svg></button>
    <div class="sep"></div>
    <button id="t-pin" title="Pin a note on the surface (P)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></button>
    <button id="t-measure" title="Measure between two points (M)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
    <button id="t-clear" title="Clear pins and measurements"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
    <div class="sep"></div>
    <button id="t-section" title="Section cut (S)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12h18"/><path d="M5 12V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6"/><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6" stroke-dasharray="2 2"/></svg></button>
    <button id="t-ghost" title="Ghost the previous version (G)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 21V10a6 6 0 0 1 12 0v11l-3-2-3 2-3-2z"/><circle cx="10" cy="11" r=".8"/><circle cx="14" cy="11" r=".8"/></svg></button>
    <div class="sep"></div>
    <button id="t-blue" title="Blueprint — top, front, side with dimensions (B)" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M7 8h6M7 12h10M7 16h4"/><path d="M15 15l3 3M18 15l-3 3" stroke-width="1.2"/></svg></button>
    <button id="t-thumb" title="Use this view as the part's thumbnail (T)"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg></button>
    <button id="t-wire" title="Edges (E)" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 8 12 3l9 5-9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg></button>
  </nav>

  <main id="stage">
    <div id="labels"></div>
    <div id="partbar"><select id="parts" aria-label="Part"></select><span id="lineage"></span><button id="forkbtn" title="Start a variant from the version you're looking at">Fork</button><button id="newbtn" title="Start a new part from a description">New</button><button id="renbtn" title="Rename this part">Rename</button><a id="libbtn" href="/library.html" title="All parts, families and the trash">Library</a><a id="refbtn" href="/reference.html" title="Material &amp; solvent compatibility reference">Materials</a><a id="prbtn" href="/printers.html" title="Printers, tolerances and send-off services">Printers</a></div><div id="prchip"><select id="prsel" aria-label="Target printer"></select><span id="prfit"></span></div>
    <div id="askdlg" role="dialog"><h3 id="ask-title"></h3><input type="text" id="ask-in" spellcheck="false"><div class="row"><button class="btn" id="ask-cancel">Cancel</button><button class="btn primary" id="ask-ok">Save</button></div></div>
    <div id="newdlg" role="dialog" aria-label="New part">
      <h3>New part</h3>
      <input type="text" id="new-name" placeholder="name, e.g. falcon_50_rack" spellcheck="false">
      <textarea id="new-brief" placeholder="What is it, what does it hold, where does it live? e.g. 'Rack for 8 × 50 mL Falcons in two rows, fits the top shelf of the 4 °C, needs a handle.' Paste photos too."></textarea>
      <div id="new-attach"></div>
      <div class="row"><button class="btn" id="new-cancel">Cancel</button><button class="btn primary" id="new-go">Ask Claude to build it</button></div>
    </div>
    <div id="forkdlg" role="dialog" aria-label="Fork this part">
      <h3>New variant from <span id="fork-from">—</span></h3>
      <input type="text" id="fork-name" placeholder="name, e.g. rack_2ml_screwcap" spellcheck="false">
      <input type="text" id="fork-note" placeholder="what's this variant for? (optional)">
      <div class="mode">
        <label><input type="radio" name="fmode" value="derive" checked><span>Derive from the base<span>Imports the base's build. Fix the base once and every variant gets it on rebuild.</span></span></label>
        <label><input type="radio" name="fmode" value="copy"><span>Independent copy<span>A snapshot that stops following the base.</span></span></label>
      </div>
      <div class="row"><button class="btn" id="fork-cancel">Cancel</button><button class="btn primary" id="fork-go">Create variant</button></div>
    </div>
    <div id="ghostsrc">ghost <select id="ghost-sel"></select></div>
    <div id="hint"></div>

<script type="module">

}

const ghostMat = new THREE.MeshStandardMaterial({ color: 0xff9f43, transparent: true, opacity: 0.22, depthWrite: false, flatShading: true, side: THREE.DoubleSide });
const pinGroup = new THREE.Group(); scene.add(pinGroup);
const measGroup = new THREE.Group(); scene.add(measGroup);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h); labelR.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();
(function loop() { requestAnimationFrame(loop); controls.update(); updateCap(); renderer.render(scene, camera); labelR.render(scene, camera); })();

function fitView(box) {

}
function makeGrid(box) {

}
async function loadMesh(tag, fit) {

  if (edges) { scene.remove(edges); edges.geometry.dispose(); edges = null; }
  mesh = new THREE.Mesh(geo, plaMat); mesh.renderOrder = 2; scene.add(mesh);
  if (stencilGroup) scene.remove(stencilGroup);
  stencilGroup = makeStencilGroup(geo); scene.add(stencilGroup);

  const d = box.getSize(new THREE.Vector3()).length() * 1.5; cap.geometry.dispose(); cap.geometry = new THREE.PlaneGeometry(d, d);
  if (state.wire) showEdges();
  if (fit) { if (state.pose?.position) { camera.position.fromArray(state.pose.position); controls.target.fromArray(state.pose.target); const d = box.getSize(new THREE.Vector3()).length(); camera.near = d / 100; camera.far = d * 20; camera.updateProjectionMatrix(); controls.update(); } else fitView(box); }
  await loadGhost();
  setClipRange();
}
async function loadGhost() {
  if (ghost) { scene.remove(ghost); ghost.geometry.dispose(); ghost = null; }
  const url = ghostUrl(); if (!url) return;
  const g = await new STLLoader().loadAsync(url); g.computeVertexNormals(); ghost = new THREE.Mesh(g, ghostMat); ghost.visible = state.ghostOn; scene.add(ghost);
}
function ghostUrl() {
  const sel = $('#ghost-sel').value || 'prev', vs = state.spec?.versions || [], cur = state.version, lin = state.spec?.lineage;
  if (sel === 'prev') { const i = vs.findIndex(x => x.version === cur?.version); return i > 0 ? `/api/parts/${state.part}/versions/${vs[i - 1].tag}/stl` : null; }
  if (sel === 'parent') return lin ? `/api/parts/${lin.parent}/versions/latest/stl` : null;
  if (sel === 'parent-at') return lin ? `/api/parts/${lin.parent}/versions/v${String(lin.from_version).padStart(3, '0')}/stl` : null;

}
function renderGhostOptions() {
  const lin = state.spec?.lineage, vs = state.spec?.versions || [];
  $('#ghost-sel').innerHTML = `<option value="prev">previous version</option>` + (lin ? `<option value="parent">${lin.parent.replace(/_/g, ' ')} · latest</option><option value="parent-at">${lin.parent.replace(/_/g, ' ')} · v${String(lin.from_version).padStart(3, '0')} (fork point)</option>` : '') + vs.map(v => `<option value="${v.tag}">${v.tag} — ${esc(v.message).slice(0, 40)}</option>`).join('');
}
$('#ghost-sel').onchange = loadGhost;
function showEdges() { if (!mesh) return; if (edges) scene.remove(edges); edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, 25), new THREE.LineBasicMaterial({ color: 0x1d2025, transparent: true, opacity: 0.55 })); scene.add(edges); }

// ---------- section ----------
function setClipRange() {
  const box = mesh?.userData.box; if (!box) return;
  const ax = $('#sec-axis').value, t = $('#sec-pos').value / 1000, on = $('#t-section').getAttribute('aria-pressed') === 'true', flip = state.secFlip, solid = $('#sec-solid').checked;
  const n = new THREE.Vector3(); n[ax] = flip ? 1 : -1;
  const lo = box.min[ax], hi = box.max[ax], pos = lo + (hi - lo) * t;
  clip.normal.copy(n); clip.constant = on ? (flip ? -pos : pos) : 1e6;
  $('#sec-val').textContent = on ? `${ax} = ${pos.toFixed(1)} mm` : 'off';
  $('#sec-flip').textContent = flip ? 'keep above' : 'keep below';
  cap.visible = on && solid; if (stencilGroup) stencilGroup.visible = on && solid;
  plaMat.side = on && solid ? THREE.FrontSide : THREE.DoubleSide; plaMat.needsUpdate = true;
}
$('#sec-axis').oninput = $('#sec-pos').oninput = $('#sec-solid').onchange = setClipRange;
$('#sec-flip').onclick = () => { state.secFlip = !state.secFlip; setClipRange(); };

// ---------- tools ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function hint(t) { $('#hint').textContent = t || ''; $('#hint').classList.toggle('on', !!t); }
function setTool(t) {
  state.tool = state.tool === t ? null : t; state.mpts = [];
  for (const k of ['pin', 'measure']) $(`#t-${k}`).setAttribute('aria-pressed', String(state.tool === k));
  renderer.domElement.style.cursor = state.tool ? 'crosshair' : '';

}
$('#t-pin').onclick = () => setTool('pin'); $('#t-measure').onclick = () => setTool('measure');
$('#t-home').onclick = () => { if (!mesh) return; state.pose = null; fitView(mesh.userData.box); };
$('#t-clear').onclick = () => { clearPins(); clearMeasures(); };
$('#t-section').onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on)); $('#section').classList.toggle('on', on); setClipRange(); };
$('#t-ghost').onclick = e => { state.ghostOn = !state.ghostOn; e.currentTarget.setAttribute('aria-pressed', String(state.ghostOn)); $('#ghostsrc').classList.toggle('on', state.ghostOn); if (ghost) ghost.visible = state.ghostOn; if (state.ghostOn && !ghost) hint('Nothing to ghost yet — pick a source'); };
// ---------- blueprint ----------
state.bpTheme = localStorage.getItem('labcad.bpTheme') || 'blueprint';
async function openBlueprint() {
  if (!state.version) return;
  const bp = $('#blueprint'); bp.hidden = false; $('#t-blue').setAttribute('aria-pressed', 'true');
  $('#bp-title').textContent = `${state.part.replace(/_/g, ' ')} · ${state.version.tag}`;
  $('#bp-sheet').innerHTML = '<div id="bp-wait">Drafting…</div>';
  const url = `/api/parts/${state.part}/versions/${state.version.tag}/drawing`; $('#bp-dl').href = url; $('#bp-dl').download = `${state.part}_${state.version.tag}_drawing.svg`;
  const r = await fetch(url);
  if (!r.ok) { $('#bp-sheet').innerHTML = `<div id="bp-wait" class="err">Couldn't draft this one: ${esc((await r.json()).error || r.status)}</div>`; return; }
  $('#bp-sheet').innerHTML = await r.text(); applyBpTheme();
}
function applyBpTheme() { const svg = $('#bp-sheet svg'); if (svg) svg.setAttribute('class', `sheet ${state.bpTheme}`); $('#bp-theme').textContent = state.bpTheme === 'blueprint' ? 'Paper' : 'Blueprint'; }
function closeBlueprint() { $('#blueprint').hidden = true; $('#t-blue').setAttribute('aria-pressed', 'false'); }
$('#t-blue').onclick = () => $('#blueprint').hidden ? openBlueprint() : closeBlueprint();
$('#bp-close').onclick = closeBlueprint;
$('#bp-theme').onclick = () => { state.bpTheme = state.bpTheme === 'blueprint' ? 'paper' : 'blueprint'; localStorage.setItem('labcad.bpTheme', state.bpTheme); applyBpTheme(); };
$('#t-thumb').onclick = async () => {
  const img = snapshot(960); if (!img) return;
  const pose = { position: camera.position.toArray(), target: controls.target.toArray() };
  const r = await fetch(`/api/parts/${state.part}/thumbnail`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ image: img, pose }) });
  state.pose = pose; hint(r.ok ? 'Saved — this view is the thumbnail and the home view' : 'Could not save thumbnail'); setTimeout(() => hint(''), 2500);
};
$('#t-wire').onclick = e => { state.wire = !state.wire; e.currentTarget.setAttribute('aria-pressed', String(state.wire)); if (state.wire) showEdges(); else if (edges) { scene.remove(edges); edges = null; } };
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const k = e.key.toLowerCase();
  if (k === 'p') setTool('pin'); else if (k === 'm') setTool('measure'); else if (k === 'escape') { if (!$('#blueprint').hidden) closeBlueprint(); else state.tool && setTool(state.tool); }

renderer.domElement.addEventListener('pointerup', e => {

  if (state.tool === 'pin') addPin(hit.point); else addMeasurePoint(hit.point);
});
function dropLabels(o) { o.traverse(x => { if (x.isCSS2DObject) x.element.remove(); }); }
function markerSize() { return mesh ? mesh.userData.box.getSize(new THREE.Vector3()).length() * 0.007 : 1; }
function addPin(p) {
  const n = state.pins.length + 1; const s = new THREE.Mesh(new THREE.SphereGeometry(markerSize(), 16, 12), new THREE.MeshBasicMaterial({ color: 0xff9f43 })); s.position.copy(p);
  const el = document.createElement('div'); el.className = 'pin-label'; el.textContent = n; s.add(new CSS2DObject(el)); pinGroup.add(s);

  const g = new THREE.Group(); g.add(line, lab); measGroup.add(g);

  state.measures.push({ label: `${ax}-ish, ${a.x.toFixed(0)},${a.y.toFixed(0)},${a.z.toFixed(0)} → ${b.x.toFixed(0)},${b.y.toFixed(0)},${b.z.toFixed(0)}`, mm, obj: g });

// ---------- data ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function loadPartsList() {
  const parts = await (await fetch('/api/parts')).json();
  const cur = $('#parts').value;
  $('#parts').innerHTML = parts.map(p => `<option value="${p.name}">${p.lineage ? '\u21b3 ' : ''}${p.name.replace(/_/g, ' ')}</option>`).join('');
  if (cur) $('#parts').value = cur;
  return parts;
}
async function loadParts() {
  const parts = await loadPartsList();
  const want = new URLSearchParams(location.search).get('part') || localStorage.getItem('labcad.part') || parts[0]?.name;
  if (want && parts.some(p => p.name === want)) $('#parts').value = want;
  if (parts.length) selectPart($('#parts').value); else $('#chat').innerHTML = '<div id="empty">No parts yet. Add parts/&lt;name&gt;/model.py and build it once.</div>';
}
$('#parts').onchange = () => selectPart($('#parts').value);
async function selectPart(name) {
  state.part = name; localStorage.setItem('labcad.part', name); history.replaceState(null, '', `?part=${name}`);
  clearPins(); clearMeasures(); state.version = null;
  state.pose = await (await fetch(`/api/parts/${name}/pose`)).json();
  await refresh(true);
  $('#text').value = localStorage.getItem(`labcad.draft.${name}`) || '';
  const wantV = Number(new URLSearchParams(location.search).get('v')); if (wantV) { const v = state.spec.versions.find(x => x.version === wantV); if (v) await showVersion(v); }
}
async function refresh(showLatest) {
  state.spec = await (await fetch(`/api/parts/${state.part}`)).json();
  renderChat(); renderVersions(); renderKnobs(); renderGhostOptions(); renderLineage(); renderFamily(); renderPrinter();
  const vs = state.spec.versions; if (!vs.length) return;
  if (showLatest || !state.version) await showVersion(vs[vs.length - 1]);
}
async function showVersion(v) {
  const vs = state.spec.versions, fit = !state.version || state.version.part !== v.part; state.version = v; if (!$('#blueprint').hidden) openBlueprint();
  await loadMesh(v.tag, fit);
  $('#tb-part').textContent = state.part.replace(/_/g, ' '); $('#tb-ver').textContent = `${v.tag} of ${vs.length}`;
  $('#tb-env').textContent = v.envelope.map(n => n.toFixed(1)).join(' × ') + ' mm';
  $('#tb-vol').textContent = `${v.volume_cm3} cm³ · ${v.mass_g_pla} g PLA solid`;
  $('#tb-ts').textContent = v.ts.replace('T', ' '); $('#tb-msg').textContent = v.message || '—';

}
function renderVersions() {
  const vs = [...state.spec.versions].reverse();
  $('#versions').innerHTML = vs.map(v => `<div class="ver ${state.version?.version === v.version ? 'on' : ''}" data-v="${v.version}">
    <span class="tag">${v.tag}</span><span>${v.mass_g_pla} g · ${v.envelope.map(n => n.toFixed(0)).join('×')}</span><span style="color:var(--ink-3);font-size:12px">${v.ts.slice(5, 16).replace('T', ' ')}</span>
    <span class="msg2">${esc(v.message) || '<i style="color:var(--ink-3)">no message</i>'}</span>
    <span class="dl"><a href="/api/parts/${state.part}/versions/${v.tag}/stl">STL</a><a href="/api/parts/${state.part}/versions/${v.tag}/step">STEP</a><a href="/api/parts/${state.part}/versions/${v.tag}/png" target="_blank">render</a></span>
    <span class="act">${v.version !== state.spec.versions.at(-1).version ? `<button data-restore="${v.tag}">Make this current</button><button data-forkv="${v.version}">Fork from here</button>` : ''}<button class="ren" data-relabel="${v.tag}">Relabel</button>${state.spec.versions.length > 1 ? `<button data-delv="${v.tag}" style="color:var(--ink-3)">Delete</button>` : ''}</span></div>`).join('');
  $('#versions').querySelectorAll('.ver').forEach(el => el.onclick = e => { if (e.target.tagName === 'A' || e.target.tagName === 'BUTTON') return; showVersion(state.spec.versions.find(v => v.version == el.dataset.v)); });
  $('#versions').querySelectorAll('button[data-restore]').forEach(b => b.onclick = async () => { b.textContent = 'Restoring…'; const r = await fetch(`/api/parts/${state.part}/restore/${b.dataset.restore}`, { method: 'POST' }); if (r.ok) await refresh(true); else b.textContent = 'Restore failed'; });
  $('#versions').querySelectorAll('button[data-forkv]').forEach(b => b.onclick = () => openFork(Number(b.dataset.forkv)));
  $('#versions').querySelectorAll('button[data-relabel]').forEach(b => b.onclick = async () => { const v = state.spec.versions.find(x => x.tag === b.dataset.relabel); const m = await ask(`Relabel ${v.tag}`, v.message); if (m == null || m === v.message) return; await fetch(`/api/parts/${state.part}/versions/${v.tag}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: m }) }); await refresh(false); if (state.version?.tag === v.tag) showVersion(state.spec.versions.find(x => x.tag === v.tag)); });
  $('#versions').querySelectorAll('button[data-delv]').forEach(b => b.onclick = async () => { if (!confirm(`Move ${b.dataset.delv} to the trash? Restore it from the Library if you change your mind.`)) return; const r = await fetch(`/api/parts/${state.part}/versions/${b.dataset.delv}`, { method: 'DELETE' }); if (r.ok) { if (state.version?.tag === b.dataset.delv) state.version = null; await refresh(!state.version); } else hint((await r.json()).detail || 'Delete failed'); });
}
function renderChat() {
  const c = $('#chat'); c.innerHTML = state.spec.chat.length ? state.spec.chat.map(m => {
    const v = m.version ? `<span class="v" data-v="${m.version}">v${String(m.version).padStart(3, '0')}</span>` : '';
    if (m.role === 'build') return `<div class="msg build"><div class="body">${v} rebuilt from knobs${m.params_changed && Object.keys(m.params_changed).length ? ': ' + esc(Object.entries(m.params_changed).map(([k, x]) => `${k}=${x}`).join(', ')) : ''}</div></div>`;
    const pins = m.pins?.length ? `<ul class="pins">${m.pins.map(p => `<li data-n="${p.n}">${esc(p.note) || '(no note)'} <span style="color:var(--ink-3)">${p.x.toFixed(0)},${p.y.toFixed(0)},${p.z.toFixed(0)}</span></li>`).join('')}</ul>` : '';
    const shots = m.shots?.length ? `<div class="shots">${m.shots.map(f => `<a href="/api/parts/${state.part}/shots/${f}" target="_blank"><img src="/api/parts/${state.part}/shots/${f}" alt=""></a>`).join('')}</div>` : '';
    return `<div class="msg ${m.role}"><div class="who"><b>${m.role === 'assistant' ? 'Claude' : 'You'}</b> ${m.ts.slice(5, 16).replace('T', ' ')} ${v}</div><div class="body">${esc(m.text).replace(/\n/g, '<br>')}${pins}${shots}</div></div>`;
  }).join('') : '<div id="empty">Nothing said yet. Drop a pin, tell Claude what bugs you.</div>';
  c.querySelectorAll('.v').forEach(el => el.onclick = () => { const v = state.spec.versions.find(v => v.version == el.dataset.v); if (v) showVersion(v); });
  c.scrollTop = c.scrollHeight;
}
function renderKnobs() {
  const { knobs, params } = state.spec; state.knobs = { ...params };
  $('#knobs').innerHTML = (state.spec.doc ? `<p style="color:var(--ink-2);margin:0 0 16px;font-size:13px">${esc(state.spec.doc.split('\n')[0])}</p>` : '') + knobs.map(k => {
    if (!k.range) return `<div class="knob" data-k="${k.key}"><label>${k.key}<span>${esc(k.value)}</span></label></div>`;
    const [lo, hi, st] = k.range;
    return `<div class="knob" data-k="${k.key}"><label>${k.key}<span></span></label><input type="range" min="${lo}" max="${hi}" step="${st}" value="${k.value}"><input type="number" min="${lo}" max="${hi}" step="${st}" value="${k.value}"></div>`;
  }).join('');
  $('#knobs').querySelectorAll('.knob').forEach(el => {
    const k = el.dataset.k, r = el.querySelector('input[type=range]'), n = el.querySelector('input[type=number]'); if (!r) return;
    const set = v => { state.knobs[k] = Number(v); r.value = n.value = v; el.classList.toggle('changed', Number(v) !== params[k]); el.querySelector('label span').textContent = Number(v) !== params[k] ? `was ${params[k]}` : ''; knobState(); };
    r.oninput = () => set(r.value); n.onchange = () => set(n.value);
  });
  knobState();
}
function changedKnobs() { return Object.fromEntries(Object.entries(state.knobs).filter(([k, v]) => v !== state.spec.params[k])); }
function knobState() { const ch = changedKnobs(), n = Object.keys(ch).length; $('#knobstate').textContent = n ? `${n} change${n > 1 ? 's' : ''}: ${Object.entries(ch).map(([k, v]) => `${k} ${state.spec.params[k]}→${v}`).join(', ')}` : 'Drag a knob, then rebuild. No Claude involved — it\'s just the model.'; $('#rebuild').disabled = !n || state.busy; }
$('#knobreset').onclick = renderKnobs;
$('#rebuild').onclick = async () => {
  const ch = changedKnobs(); if (!Object.keys(ch).length) return; setBusy(true); $('#knobstate').textContent = 'Building…';
  const msg = Object.entries(ch).map(([k, v]) => `${k} ${state.spec.params[k]}→${v}`).join(', ');
  const r = await fetch(`/api/parts/${state.part}/build`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ params: ch, message: msg }) });
  setBusy(false);
  if (!r.ok) { $('#knobstate').innerHTML = `<span class="err">Build failed — ${esc((await r.json()).error.split('\n').filter(Boolean).pop())}</span>`; return; }
  await refresh(true);
};
function setBusy(b) { state.busy = b; $('#send').disabled = b; $('#rebuild').disabled = b || !Object.keys(changedKnobs()).length; $('#live').classList.toggle('busy', b); }

// ---------- screenshots & attachments ----------
function snapshot(maxW = 1400) {
  if (!mesh) return null;
  controls.update(); updateCap(); renderer.render(scene, camera);           // fresh frame, same task, so the buffer is still there
  const src = renderer.domElement, k = Math.min(1, maxW / src.width);
  const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#1d2025'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0, c.width, c.height);
  const dot = (p, txt, r) => { const v = p.clone().project(camera); if (v.z > 1) return; const x = (v.x + 1) / 2 * c.width, y = (1 - v.y) / 2 * c.height;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = '#ff9f43'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#2a1a06'; ctx.stroke();
    ctx.fillStyle = '#2a1a06'; ctx.font = `bold ${Math.round(r * 1.2)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, x, y + 1); };
  for (const p of state.pins) dot(p.obj.position, String(p.n), 12 * k + 4);
  for (const m of state.measures) { const [l] = m.obj.children; const a = new THREE.Vector3().fromBufferAttribute(l.geometry.attributes.position, 0), b = new THREE.Vector3().fromBufferAttribute(l.geometry.attributes.position, 1);
    const va = a.clone().project(camera), vb = b.clone().project(camera); ctx.beginPath(); ctx.moveTo((va.x + 1) / 2 * c.width, (1 - va.y) / 2 * c.height); ctx.lineTo((vb.x + 1) / 2 * c.width, (1 - vb.y) / 2 * c.height); ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 2; ctx.stroke();
    dot(a.clone().lerp(b, 0.5), `${m.mm.toFixed(1)}`, 16 * k + 4); }
  return c.toDataURL('image/jpeg', 0.85);
}
state.attachments = [];
function addAttachment(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const rd = new FileReader(); rd.onload = () => {
    const img = new Image(); img.onload = () => {                         // downscale big phone photos before upload
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); state.attachments.push(c.toDataURL('image/jpeg', 0.88)); renderAttachments(); };
    img.src = rd.result; };
  rd.readAsDataURL(file);
}
function renderAttachments() {
  $('#attach').innerHTML = state.attachments.map((a, i) => `<div class="a"><img src="${a}" alt=""><button data-i="${i}" title="Remove">×</button></div>`).join('');
  $('#attach').querySelectorAll('button').forEach(b => b.onclick = () => { state.attachments.splice(b.dataset.i, 1); renderAttachments(); });
}
$('#text').addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { addAttachment(it.getAsFile()); e.preventDefault(); } });
for (const ev of ['dragenter', 'dragover']) $('#compose').addEventListener(ev, e => { e.preventDefault(); $('#compose').classList.add('drop'); });
for (const ev of ['dragleave', 'drop']) $('#compose').addEventListener(ev, e => { e.preventDefault(); $('#compose').classList.remove('drop'); });
$('#compose').addEventListener('drop', e => { for (const f of e.dataTransfer.files) addAttachment(f); });

// ---------- send to Claude ----------
$('#text').oninput = () => localStorage.setItem(`labcad.draft.${state.part}`, $('#text').value);
$('#text').onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#send').click(); };
$('#send').onclick = async () => {
  const text = $('#text').value.trim(); if (!text && !state.pins.length) { hint('Say something, or drop a pin'); return; }
  setBusy(true); $('#live').textContent = 'Sending…';
  const body = { text, version: state.version?.version, pins: state.pins.map(({ n, x, y, z, note }) => ({ n, x, y, z, note })), measures: state.measures.map(({ label, mm }) => ({ label, mm })), shot: snapshot(), attachments: state.attachments };
  state.attachments = []; renderAttachments();
  $('#text').value = ''; localStorage.removeItem(`labcad.draft.${state.part}`);
  let res; try { res = await fetch(`/api/parts/${state.part}/feedback`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); } catch (e) { $('#live').innerHTML = `<span class="err">Couldn't reach the Studio server.</span>`; setBusy(false); return; }
  await refresh(false);
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '', newest = null;
  while (true) {
    const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue; const ev = JSON.parse(line);
      if (ev.type === 'status') $('#live').textContent = ev.text;
      else if (ev.type === 'error') $('#live').innerHTML = `<span class="err">${esc(ev.text)}</span>`;
      else if (ev.type === 'final') { newest = ev.new_versions?.at(-1) || null; $('#live').textContent = ''; }
    }
  }
  setBusy(false); clearPins(); clearMeasures();
  await refresh(!!newest);
};

// ---------- lineage, family, fork ----------
function renderLineage() {
  const lin = state.spec.lineage; if (!lin) { $('#lineage').textContent = ''; return; }
  $('#lineage').innerHTML = `${lin.mode === 'derive' ? 'derives from' : 'copied from'} <b data-p="${lin.parent}">${lin.parent.replace(/_/g, ' ')}</b> v${String(lin.from_version).padStart(3, '0')}`;
  $('#lineage b').onclick = () => { $('#parts').value = lin.parent; selectPart(lin.parent); };
}
async function renderFamily() {
  const fam = await (await fetch('/api/family')).json();
  const byN = Object.fromEntries(fam.nodes.map(n => [n.name, n]));
  let root = byN[state.part]; while (root?.lineage && byN[root.lineage.parent]) root = byN[root.lineage.parent];
  const inFam = new Set(); const kidsOf = {}; fam.edges.forEach(e => (kidsOf[e.parent] ||= []).push(e.child));
  const walk = n => { inFam.add(n); (kidsOf[n] || []).forEach(walk); }; if (root) walk(root.name);
  const wrap = $('#family'); wrap.innerHTML = `<div class="tlwrap"></div><div class="famlist"></div>`;
  if (root) drawTimelineVertical(wrap.querySelector('.tlwrap'), { nodes: fam.nodes.filter(n => inFam.has(n.name)), edges: fam.edges.filter(e => inFam.has(e.child)) },
    { roots: [root], current: { part: state.part, version: state.version?.version }, onPick: async (p, v) => { if (p !== state.part) { $('#parts').value = p; await selectPart(p); } if (v) { const vv = state.spec.versions.find(x => x.version === v); if (vv) await showVersion(vv); } } });
  await renderFamilyList(fam, wrap.querySelector('.famlist'), inFam);
}
async function renderFamilyList(fam, into, inFam) {
  const kids = {}; fam.edges.forEach(e => (kids[e.parent] ||= []).push(e));
  const byName = Object.fromEntries(fam.nodes.map(n => [n.name, n]));
  const roots = fam.nodes.filter(n => !n.lineage);
  const node = (n, edge) => `<li><div class="node ${n.name === state.part ? 'on' : ''}" data-p="${n.name}"><span class="nm">${n.name.replace(/_/g, ' ')}</span><span class="ct">${n.versions} version${n.versions === 1 ? '' : 's'}</span>
      <span class="why">${edge ? `${edge.mode === 'derive' ? 'derives from' : 'copied from'} v${String(edge.at).padStart(3, '0')}${n.lineage?.note ? ' — ' + esc(n.lineage.note) : ''}` : (n.latest ? esc(n.latest.message) : 'not built yet')}</span></div>
      ${(kids[n.name] || []).length ? `<ul>${kids[n.name].map(e => byName[e.child] ? node(byName[e.child], e) : '').join('')}</ul>` : ''}</li>`;
  const others = roots.filter(r => !inFam.has(r.name));
  into.innerHTML = (others.length ? `<p style="color:var(--ink-3);font-size:12.5px;margin:14px 0 6px">Other families</p><ul class="fam">${others.map(r => node(r, null)).join('')}</ul>` : '') + `<p style="margin:14px 0 0"><a href="/library.html" style="color:var(--ink-2)">Open the Library</a> to pose thumbnails, delete, or restore.</p>`;
  into.querySelectorAll('.node').forEach(el => el.onclick = () => { $('#parts').value = el.dataset.p; selectPart(el.dataset.p); });
}
function openFork(fromVersion) {
  const v = fromVersion || state.version?.version; if (!v) return;
  $('#forkdlg').dataset.from = v; $('#fork-from').textContent = `${state.part.replace(/_/g, ' ')} v${String(v).padStart(3, '0')}`;
  $('#fork-name').value = ''; $('#fork-note').value = ''; $('#forkdlg').classList.add('on'); $('#fork-name').focus();
}
$('#forkbtn').onclick = () => openFork();
// ---------- target printer ----------
const FITLBL = { fits: 'fits the bed', rotate: 'fits turned 90°', diagonal: 'fits diagonally', too_big: 'too big for the bed', unknown: '—' };
async function renderPrinter() {
  const d = await (await fetch('/api/printers')).json();
  const cur = state.spec?.printer || {};
  $('#prsel').innerHTML = Object.entries(d.printers).map(([k, p]) =>
    `<option value="${k}" ${k === cur.key ? 'selected' : ''}>${esc(p.name)}${k === d.default ? ' (default)' : ''}</option>`).join('');
  const fit = state.spec?.versions?.length ? await (await fetch(`/api/parts/${state.part}/fit`)).json() : { status: 'unknown' };
  const el = $('#prfit'); el.className = fit.status || 'unknown';
  el.textContent = FITLBL[fit.status] || '—';
  el.title = [fit.how, fit.over?.some(v => v > 0) ? `over by ${fit.over.filter(v => v > 0).map(v => v + ' mm').join(', ')}` : '',
              fit.bed ? `bed ${fit.bed.map(Math.round).join('×')} mm` : ''].filter(Boolean).join(' · ');
  $('#tb-pr').textContent = `${cur.name || '—'}${fit.status && fit.status !== 'unknown' ? ' · ' + FITLBL[fit.status] : ''}`;
}
$('#prsel').onchange = async () => {
  await fetch(`/api/parts/${state.part}/printer`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ printer: $('#prsel').value }) });
  state.spec = await (await fetch(`/api/parts/${state.part}`)).json();
  await renderPrinter();
  hint('Target printer set — Claude designs to it from here on'); setTimeout(() => hint(''), 2600);
};
// ---------- tiny prompt dialog ----------
function ask(title, value = '') {
  return new Promise(res => {
    const d = $('#askdlg'); $('#ask-title').textContent = title; $('#ask-in').value = value; d.classList.add('on'); $('#ask-in').focus(); $('#ask-in').select();
    const done = v => { d.classList.remove('on'); $('#ask-ok').onclick = $('#ask-cancel').onclick = null; $('#ask-in').onkeydown = null; res(v); };
    $('#ask-ok').onclick = () => done($('#ask-in').value.trim()); $('#ask-cancel').onclick = () => done(null);
    $('#ask-in').onkeydown = e => { if (e.key === 'Enter') $('#ask-ok').click(); if (e.key === 'Escape') $('#ask-cancel').click(); };
  });
}
$('#renbtn').onclick = async () => {
  const v = await ask(`Rename "${state.part.replace(/_/g, ' ')}" — letters, digits, underscores`, state.part); if (!v || v === state.part) return;
  const r = await fetch(`/api/parts/${state.part}/rename`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ new_name: v }) });
  if (!r.ok) { hint((await r.json()).detail || 'Rename failed'); setTimeout(() => hint(''), 4000); return; }
  const { name } = await r.json(); await loadPartsList(); $('#parts').value = name; await selectPart(name);
};
// ---------- new part from a brief ----------
state.newAttach = [];
function renderNewAttach() { $('#new-attach').innerHTML = state.newAttach.map((a, i) => `<div class="a"><img src="${a}" alt=""></div>`).join(''); }
$('#newbtn').onclick = () => { $('#newdlg').classList.add('on'); $('#forkdlg').classList.remove('on'); $('#new-name').focus(); };
$('#new-cancel').onclick = () => $('#newdlg').classList.remove('on');
$('#new-name').onkeydown = e => { if (e.key === 'Escape') $('#new-cancel').click(); };
$('#new-brief').addEventListener('paste', e => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { const f = it.getAsFile(); const rd = new FileReader(); rd.onload = () => { state.newAttach.push(rd.result); renderNewAttach(); }; rd.readAsDataURL(f); e.preventDefault(); } });
$('#new-go').onclick = async () => {
  const name = $('#new-name').value.trim(), brief = $('#new-brief').value.trim();
  if (!name) { $('#new-name').focus(); return; } if (!brief) { $('#new-brief').focus(); return; }
  $('#new-go').disabled = true; $('#new-go').textContent = 'Starting…';
  const res = await fetch('/api/parts/new', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name, brief, attachments: state.newAttach }) });
  if (!res.ok) { const e = await res.json(); hint(e.detail || 'Could not start'); setTimeout(() => hint(''), 4000); $('#new-go').disabled = false; $('#new-go').textContent = 'Ask Claude to build it'; return; }
  $('#newdlg').classList.remove('on'); $('#new-go').disabled = false; $('#new-go').textContent = 'Ask Claude to build it'; state.newAttach = []; renderNewAttach();
  const created = name.toLowerCase().replace(/[ -]/g, '_');
  await loadPartsList(); $('#parts').value = created; state.part = created; localStorage.setItem('labcad.part', created); history.replaceState(null, '', `?part=${created}`);
  clearPins(); clearMeasures(); state.version = null; if (mesh) { scene.remove(mesh); mesh = null; }
  state.spec = { name: created, doc: '', params: {}, knobs: [], versions: [], chat: [{ role: 'user', text: brief, ts: new Date().toISOString(), pins: [] }], lineage: null };
  renderChat(); renderVersions(); renderKnobs(); document.querySelector('#tabs button[data-pane=talk]').click();
  setBusy(true); $('#live').textContent = 'Claude is designing it…';
  const rd = res.body.getReader(), dec = new TextDecoder(); let buf = '';
  while (true) {
    const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue; const ev = JSON.parse(line);
      if (ev.type === 'status') $('#live').textContent = ev.text;
      else if (ev.type === 'error') $('#live').innerHTML = `<span class="err">${esc(ev.text)}</span>`;
      else if (ev.type === 'final') $('#live').textContent = '';
    }
  }
  setBusy(false); await refresh(true);
};
$('#fork-cancel').onclick = () => $('#forkdlg').classList.remove('on');
$('#fork-name').onkeydown = e => { if (e.key === 'Enter') $('#fork-go').click(); if (e.key === 'Escape') $('#fork-cancel').click(); };
$('#fork-go').onclick = async () => {
  const name = $('#fork-name').value.trim(); if (!name) { $('#fork-name').focus(); return; }
  $('#fork-go').disabled = true; $('#fork-go').textContent = 'Creating…';
  const r = await fetch(`/api/parts/${state.part}/fork`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ new_name: name, from_version: Number($('#forkdlg').dataset.from), mode: document.querySelector('input[name=fmode]:checked').value, note: $('#fork-note').value.trim() }) });
  $('#fork-go').disabled = false; $('#fork-go').textContent = 'Create variant';
  if (!r.ok) { const e = await r.json(); hint(e.detail || e.error?.split('\n').filter(Boolean).pop() || 'Fork failed'); setTimeout(() => hint(''), 4000); return; }
  const { name: created } = await r.json(); $('#forkdlg').classList.remove('on');
  await loadPartsList(); $('#parts').value = created; await selectPart(created);
};

document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b))); document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === `pane-${b.dataset.pane}`)); });
loadParts().then(() => { if (new URLSearchParams(location.search).get('new')) $('#newbtn').click(); });
</script>
